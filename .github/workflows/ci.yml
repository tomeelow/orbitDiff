name: ci

# Lint and test on every change. No secrets and no catalog calls: the test suite must pass
# offline, so a test that quietly depends on Earth Search or a token fails here first.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:                     # the API tests run against real PostGIS, as in docker-compose.yml
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: orbitdiff
          POSTGRES_PASSWORD: orbitdiff
          POSTGRES_DB: orbitdiff_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbitdiff" --health-interval 5s --health-retries 10
    env:
      ORBITDIFF_TEST_DATABASE_URL: postgresql+psycopg://orbitdiff:orbitdiff@localhost:5432/orbitdiff_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -rs   # -rs: a skipped database test would show here

      - name: Compose file is valid
        run: docker compose config --quiet
        env:
          ORBITDIFF_SIGNING_KEY: not-a-secret-only-for-the-config-check

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Install
        run: |
          npm install --global pnpm@12.18.0
          pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm exec vite build

  images:
    # The API and web images build. The worker image is the same Dockerfile plus the ml
    # group (PyTorch, several GB), so it's left to local builds.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORBITDIFF_SIGNING_KEY: not-a-secret-only-for-the-build
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker compose build api web

      - name: The API imports in its image
        run: docker run --rm orbitdiff-app python -c "import orbitdiff.api"
