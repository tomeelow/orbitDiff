name: ci

# Lint and test on every change. No secrets and no catalog calls: the test suite must pass
# offline, so a test that quietly depends on Earth Search or a token fails here first.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:                     # the API tests run against real PostGIS, as in docker-compose.yml
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: orbitdiff
          POSTGRES_PASSWORD: orbitdiff
          POSTGRES_DB: orbitdiff_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbitdiff" --health-interval 5s --health-retries 10
    env:
      ORBITDIFF_TEST_DATABASE_URL: postgresql+psycopg://orbitdiff:orbitdiff@localhost:5432/orbitdiff_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --group ml   # the building model's tests need PyTorch (CPU)

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run --group ml pytest -rs   # -rs: a skipped test would show here

      - name: Compose file is valid
        run: docker compose config --quiet
        env:
          ORBITDIFF_SIGNING_KEY: not-a-secret-only-for-the-config-check

      - name: Production compose file is valid
        run: docker compose --file deploy/compose.yml --env-file /dev/null config --quiet
        env:
          ORBITDIFF_DOMAIN: orbit.example.com
          ORBITDIFF_REGISTRY: ghcr.io/example
          ORBITDIFF_VERSION: v0.0.0
          POSTGRES_PASSWORD: not-a-secret-only-for-the-config-check
          ORBITDIFF_SIGNING_KEY: not-a-secret-only-for-the-config-check
          ORBITDIFF_SMTP_HOST: smtp.example.com
          ORBITDIFF_MAIL_FROM: alerts@example.com

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Install
        run: |
          npm install --global pnpm@12.18.0
          pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm exec vite build

  images:
    # The images build, and each imports what it runs. The worker's PyTorch is CPU-only.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORBITDIFF_SIGNING_KEY: not-a-secret-only-for-the-build
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          docker compose build api worker web
          docker build --tag orbitdiff-backup --file docker/backup.Dockerfile .

      - name: The API imports in its image
        run: docker run --rm orbitdiff-app python -c "import orbitdiff.api"

      - name: The worker has the cloud model, without CUDA
        run: >
          docker run --rm orbitdiff-worker python -c
          "import omnicloudmask, torch; assert torch.version.cuda is None, torch.version.cuda"

      - name: The backup image has its tools
        run: docker run --rm orbitdiff-backup sh -c "pg_dump --version && rclone version"
