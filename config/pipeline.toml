# Pipeline parameters. Versioned with the code; secrets live in the environment, never here.
# Why these values: docs/ADR.md. Evidence behind them: docs/spikes.md.

[aoi]
max_km2 = 10                      # windowed reads and the per-AOI cube assume small areas (ADR-001)
archive_start = 2017-01-01

# The one place that maps our band names to each catalog's asset keys.
[catalog.primary]                 # ADR-002: one item per pass, newest processing baseline
name = "earth-search"
url = "https://earth-search.aws.element84.com/v1"
collection = "sentinel-2-l2a"
page_size = 100                   # larger pages return HTTP 500
assets = { blue = "blue", green = "green", red = "red", nir = "nir", scl = "scl" }

[catalog.fallback]                # ADR-002: COGs + anonymous token, not CDSE's JPEG 2000
name = "planetary-computer"
url = "https://planetarycomputer.microsoft.com/api/stac/v1"
collection = "sentinel-2-l2a"
page_size = 1000
token_url = "https://planetarycomputer.microsoft.com/api/sas/v1/token/sentinel-2-l2a"
assets = { blue = "B02", green = "B03", red = "B04", nir = "B08", scl = "SCL" }

[reading]                         # docs/spikes.md, section 3
max_tile_cloud_pct = 95           # tile-level pre-filter only; usability is decided per AOI
fetch_min_clear_frac = 0.05       # read the 10 m bands only when SCL shows this much clear AOI
workers = 16                      # concurrent window reads: latency, not bandwidth, is the limit

[masking]
scl_drop = [0, 1, 3, 8, 9, 10]    # no data, defective, cloud shadow, cloud medium/high, thin cirrus
scl_flag = [11]                   # snow: kept, flagged
scene_min_clear_frac = 0.6        # a pass "counts" as clear for the AOI above this
dilate_px = 2                     # grow clouds and shadows by 20 m (one SCL pixel); edges fail first
cloud_model = "omnicloudmask"     # learned model on top of SCL, for haze and thin cirrus
cloud_model_version = 4.0         # pinned: a new version means rerunning every AOI's masks
cloud_model_classes = [1, 2, 3]   # model classes masked: thick cloud, thin cloud, shadow
# A pass whose offset flag contradicts its pixels is left out (docs/spikes.md, section 5).
offset_check_scl = [4, 5, 6]      # reference pixels: vegetation, bare soil, water
offset_check_percentile = 2       # dark targets: this percentile of min(blue, red) reflectance
offset_check_min_dark = -0.02     # correct passes read 0.006-0.07; offset subtracted twice, ~-0.09
offset_check_min_pixels = 100     # fewer reference pixels than this: trust the metadata

[composites]
fill_max_months = 3               # display only: fill a pixel from clear months at most this far away

[detection]
min_mapping_unit_ha = 0.1         # floor under the user's "smallest change" slider (10 pixels)
seasonal_revert_months = 3        # a change that reverts within this is seasonal
confirm_on_next_clear = true
# A pass speaks for an event when this much of the footprint is clear on it and observed
# in the reference, and agrees when the change shows in this much of that part.
footprint_clear_frac = 0.5
agree_frac = 0.5
# Detector thresholds. PROVISIONAL: starting values from the implementation plan, not yet
# tuned on a verified evaluation set (eval/README.md).
ndvi_drop = 0.3                   # naive baseline: NDVI fall against the same month a year earlier

[detection.categories]            # starting heuristics (implementation plan, Phase 7), on medians over the footprint
water_ndwi = 0.0                  # NDWI after above this, and not before: water
built_ndvi = 0.25                 # NDVI after below this: built, bare or industrial
vegetation_ndvi = 0.6             # NDVI before at least this: forest or shrub
bare_ndvi = 0.35                  # ...and after below this: vegetation loss
dark_visible = 0.05               # mean visible reflectance after below this,
dark_nir = 0.15                   # and NIR below this: solar or industry

[evaluation]                      # matching detections to labelled events (eval/)
min_overlap = 0.25                # intersection, as a share of the smaller footprint
months_before = 1                 # a detection may come this many months before the labelled month
months_after = 12                 # ...or this many after

[jobs]
backfill_timeout_hours = 4         # a ten-year backfill reads ~1,400 passes

[schedule]
poll_every_hours = 3              # ADR-008
