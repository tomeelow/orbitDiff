# The whole stack, locally: `docker compose up --build`, then http://localhost:8080.
# For development with hot reload, start only the infrastructure
# (`docker compose up -d db redis mailpit titiler`) and run the app with uv and pnpm.
#
# The app services share ./data (cubes, composites, the cloud model) and the database with
# development, so either way sees the same areas. Object storage is not here: only
# deployments point at S3-compatible storage. Email goes to Mailpit and nowhere else.

x-app: &app
  build: .
  image: orbitdiff-app
  restart: unless-stopped
  environment:
    ORBITDIFF_DATABASE_URL: postgresql+psycopg://orbitdiff:orbitdiff@db:5432/orbitdiff
    ORBITDIFF_REDIS_URL: redis://redis:6379/0
    ORBITDIFF_SMTP_HOST: mailpit
    ORBITDIFF_WEB_URL: http://localhost:8080          # as the browser reaches them
    ORBITDIFF_API_URL: http://localhost:8000
    ORBITDIFF_CORS_ORIGINS: '["http://localhost:8080"]'
    ORBITDIFF_SIGNING_KEY: ${ORBITDIFF_SIGNING_KEY:?set it in .env; see .env.example}
    ORBITDIFF_ADMIN_EMAILS: ${ORBITDIFF_ADMIN_EMAILS:-[]}
  volumes: [./data:/app/data]
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_started }
    mailpit: { condition: service_started }

services:
  migrate:                           # brings the schema up to date, then exits
    <<: *app
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    command: uvicorn orbitdiff.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

  worker:                            # backfills and alert emails
    <<: *app
    build: { context: ., args: { SYNC_ARGS: --group ml } }
    image: orbitdiff-worker
    command: orbitdiff worker

  scheduler:                         # queues an update for every watched area
    <<: *app
    command: orbitdiff scheduler

  web:
    build:
      context: ./web
      args: { VITE_API_URL: "http://localhost:8000" }
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [api, titiler]

  db:
    image: postgis/postgis:17-3.7
    platform: linux/amd64            # the image is amd64-only; Apple Silicon runs it emulated
    environment:
      POSTGRES_USER: orbitdiff
      POSTGRES_PASSWORD: orbitdiff   # development only
      POSTGRES_DB: orbitdiff
    ports: ["5433:5432"]             # 5433: leaves a local Postgres on 5432 alone
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitdiff"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8.6
    ports: ["6379:6379"]

  mailpit:                           # catches every email in development: http://localhost:8025
    image: axllent/mailpit:v1.32.0
    ports: ["1025:1025", "8025:8025"]

  titiler:                           # map tiles from the composite COGs (ADR-007)
    image: ghcr.io/developmentseed/titiler:2.4.0
    ports: ["8001:80"]
    environment:
      COLORMAP_DIRECTORY: /colormaps   # the mockup's NDVI ramp, from orbitdiff.render
      # Tile URLs carry each month's version, so a URL's tiles never change.
      TITILER_API_CACHECONTROL: "public, max-age=31536000, immutable"
      WEB_CONCURRENCY: "2"
    volumes:
      - ./data/composites:/data/composites:ro
      - ./docker/titiler/colormaps:/colormaps:ro

volumes:
  pg:
