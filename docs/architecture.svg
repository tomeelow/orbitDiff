<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Orbit Diff architecture</title>
  <desc id="d">Browsers reach the web app and API through Caddy. The API checks ownership and relays tiles from TiTiler. A worker takes jobs from Redis, reads windows of Sentinel-2 imagery from Earth Search, writes to disk and Postgres, and sends alert email.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/></marker>
    <style>
      .box{fill:#fff;stroke:#c9ced6;stroke-width:1.2}
      .ours{fill:#eef4ff;stroke:#7ea6e0}
      .store{fill:#f4f1ea;stroke:#c8bfa8}
      .ext{fill:#fff;stroke:#c9ced6;stroke-dasharray:5 4}
      .h{font-size:14px;font-weight:600;fill:#1b2330}
      .s{font-size:12px;fill:#5b6472}
      .l{font-size:12px;fill:#5b6472}
      .line{fill:none;stroke:#5b6472;stroke-width:1.3;marker-end:url(#a)}
      .step{fill:#eef4ff;stroke:#7ea6e0;stroke-width:1.2}
      .sec{font-size:13px;font-weight:600;fill:#1b2330}
    </style>
  </defs>
  <rect width="1040" height="610" fill="#ffffff"/>

  <!-- arrows -->
  <path class="line" d="M115 78 V128"/>
  <path class="line" d="M115 178 V238"/>
  <path class="line" d="M190 153 H278"/>
  <path class="line" d="M375 192 V258"/>
  <path class="line" d="M470 140 L558 74"/>
  <path class="line" d="M470 164 H558"/>
  <path class="line" d="M750 164 H818" />
  <path class="line" d="M915 80 V128"/>
  <path class="line" d="M818 138 L752 74"/>
  <path class="line" d="M818 180 L752 268"/>
  <path class="line" d="M558 284 H472"/>
  <path class="line" d="M915 192 V258"/>
  <path class="line" d="M1010 161 H1028 V374 H192"/>

  <!-- arrow labels -->
  <text class="l" x="124" y="108">HTTPS</text>
  <text class="l" x="196" y="145">/api</text>
  <text class="l" x="383" y="230">tiles, after the owner check</text>
  <text class="l" x="924" y="110">every 3 h</text>
  <text class="l" x="924" y="230">range requests</text>
  <text class="l" x="760" y="155">jobs</text>
  <text class="l" x="480" y="365">alert email, once per event and status</text>

  <!-- boxes -->
  <rect class="box" x="40" y="30" width="150" height="48" rx="6"/>
  <text class="h" x="115" y="59" text-anchor="middle">Browser</text>

  <rect class="ours" x="40" y="130" width="150" height="48" rx="6"/>
  <text class="h" x="115" y="150" text-anchor="middle">Caddy</text>
  <text class="s" x="115" y="168" text-anchor="middle">the only public port</text>

  <rect class="ours" x="40" y="240" width="150" height="48" rx="6"/>
  <text class="h" x="115" y="260" text-anchor="middle">Web app</text>
  <text class="s" x="115" y="278" text-anchor="middle">React, MapLibre</text>

  <rect class="ours" x="280" y="120" width="190" height="72" rx="6"/>
  <text class="h" x="375" y="144" text-anchor="middle">API</text>
  <text class="s" x="375" y="162" text-anchor="middle">FastAPI. Who owns what,</text>
  <text class="s" x="375" y="178" text-anchor="middle">the one alert-rule evaluator</text>

  <rect class="ours" x="280" y="260" width="190" height="48" rx="6"/>
  <text class="h" x="375" y="280" text-anchor="middle">TiTiler</text>
  <text class="s" x="375" y="298" text-anchor="middle">composite tiles, private</text>

  <rect class="store" x="560" y="30" width="190" height="54" rx="6"/>
  <text class="h" x="655" y="52" text-anchor="middle">Postgres + PostGIS</text>
  <text class="s" x="655" y="71" text-anchor="middle">areas, events, feedback</text>

  <rect class="store" x="560" y="140" width="190" height="48" rx="6"/>
  <text class="h" x="655" y="160" text-anchor="middle">Redis</text>
  <text class="s" x="655" y="178" text-anchor="middle">job queue, sign-in limits</text>

  <rect class="store" x="560" y="255" width="190" height="60" rx="6"/>
  <text class="h" x="655" y="278" text-anchor="middle">Disk</text>
  <text class="s" x="655" y="297" text-anchor="middle">per-area Zarr cubes, COGs</text>

  <rect class="ours" x="820" y="30" width="190" height="48" rx="6"/>
  <text class="h" x="915" y="50" text-anchor="middle">Scheduler</text>
  <text class="s" x="915" y="68" text-anchor="middle">queues watched areas</text>

  <rect class="ours" x="820" y="130" width="190" height="62" rx="6"/>
  <text class="h" x="915" y="153" text-anchor="middle">Worker</text>
  <text class="s" x="915" y="172" text-anchor="middle">runs the steps below</text>

  <rect class="ext" x="820" y="260" width="190" height="60" rx="6"/>
  <text class="h" x="915" y="283" text-anchor="middle">Earth Search</text>
  <text class="s" x="915" y="302" text-anchor="middle">Planetary Computer on failure</text>

  <rect class="ext" x="40" y="350" width="150" height="48" rx="6"/>
  <text class="h" x="115" y="370" text-anchor="middle">Your inbox</text>
  <text class="s" x="115" y="388" text-anchor="middle">"Not a real change"</text>

  <!-- pipeline -->
  <text class="sec" x="20" y="446">What the worker runs for each area, for the archive and for every new pass</text>
  <g font-size="13">
    <rect class="step" x="20" y="462" width="115" height="54" rx="6"/><text class="h" x="77" y="494" text-anchor="middle">Search</text>
    <rect class="step" x="147" y="462" width="115" height="54" rx="6"/><text class="h" x="204" y="494" text-anchor="middle">Read windows</text>
    <rect class="step" x="274" y="462" width="115" height="54" rx="6"/><text class="h" x="331" y="494" text-anchor="middle">Mask clouds</text>
    <rect class="step" x="401" y="462" width="115" height="54" rx="6"/><text class="h" x="458" y="494" text-anchor="middle">Composite</text>
    <rect class="step" x="528" y="462" width="115" height="54" rx="6"/><text class="h" x="585" y="494" text-anchor="middle">Detect</text>
    <rect class="step" x="655" y="462" width="115" height="54" rx="6"/><text class="h" x="712" y="494" text-anchor="middle">Confirm</text>
    <rect class="step" x="782" y="462" width="115" height="54" rx="6"/><text class="h" x="839" y="494" text-anchor="middle">Alert</text>
    <rect class="step" x="909" y="462" width="115" height="54" rx="6"/><text class="h" x="966" y="494" text-anchor="middle">Feedback</text>
  </g>
  <path class="line" d="M135 489 H145"/><path class="line" d="M262 489 H272"/><path class="line" d="M389 489 H399"/><path class="line" d="M516 489 H526"/><path class="line" d="M643 489 H653"/><path class="line" d="M770 489 H780"/><path class="line" d="M897 489 H907"/>
  <text class="s" x="77" y="536" text-anchor="middle">one item</text><text class="s" x="77" y="552" text-anchor="middle">per pass</text>
  <text class="s" x="204" y="536" text-anchor="middle">SCL first,</text><text class="s" x="204" y="552" text-anchor="middle">bytes measured</text>
  <text class="s" x="331" y="536" text-anchor="middle">SCL, then</text><text class="s" x="331" y="552" text-anchor="middle">OmniCloudMask</text>
  <text class="s" x="458" y="536" text-anchor="middle">monthly median,</text><text class="s" x="458" y="552" text-anchor="middle">one pinned grid</text>
  <text class="s" x="585" y="536" text-anchor="middle">anniversary,</text><text class="s" x="585" y="552" text-anchor="middle">BFAST, U-Net</text>
  <text class="s" x="712" y="536" text-anchor="middle">on the next</text><text class="s" x="712" y="552" text-anchor="middle">clear pass</text>
  <text class="s" x="839" y="536" text-anchor="middle">crops, status,</text><text class="s" x="839" y="552" text-anchor="middle">signed link</text>
  <text class="s" x="966" y="536" text-anchor="middle">precision, hard</text><text class="s" x="966" y="552" text-anchor="middle">negatives</text>
</svg>
